name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.4"

      - name: Verify Swift version
        run: swift --version

      - name: Build app bundle
        env:
          APP_VERSION: ${{ github.ref_name }}
        run: ./scripts/build-app.sh

      - name: Zip app bundle
        run: |
          cd dist
          ditto -c -k --keepParent workNrelax.app workNrelax.zip

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "workNrelax $GITHUB_REF_NAME" \
            --generate-notes \
            dist/workNrelax.zip
